name: Build Varin-Sniper.exe

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Verify sources compile
        run: python -m compileall -q varin_sniper.py checker.py claimer.py proxy.py generator.py utils.py scan_history.py

      - name: Verify GUI dependencies are importable before freezing
        run: python -c "import tkinter, customtkinter; print('tkinter', tkinter.TkVersion, '| customtkinter', customtkinter.__version__)"

      - name: Build with PyInstaller
        run: pyinstaller --clean --noconfirm Varin-Sniper.spec

      - name: Verify customtkinter is bundled inside the exe
        shell: pwsh
        run: |
          $exe = "dist/Varin-Sniper.exe"
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $exe))
          $text = [System.Text.Encoding]::GetEncoding(28591).GetString($bytes)
          if (-not $text.Contains("customtkinter")) {
            Write-Error "customtkinter tidak ada di dalam $exe - GUI akan crash saat dibuka."
            exit 1
          }
          Write-Host "OK: customtkinter terbundel di dalam exe ($($bytes.Length) bytes)"
          foreach ($needle in @("_tkinter", "_tcl_data", "_tk_data")) {
            if ($text.Contains($needle)) { Write-Host "OK  : $needle terbundel" }
            else { Write-Host "WARN: $needle tidak terdeteksi - periksa bila GUI tampil kosong" }
          }

      - name: Show artifact
        run: |
          dir dist
          Get-Item dist/Varin-Sniper.exe | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Varin-Sniper-windows
          path: dist/Varin-Sniper.exe
          if-no-files-found: error
          retention-days: 30

      - name: Attach exe to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Varin-Sniper.exe
          generate_release_notes: true
